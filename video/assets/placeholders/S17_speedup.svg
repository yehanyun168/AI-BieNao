<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Microsoft YaHei, Microsoft YaHei UI, sans-serif">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#16203a" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#131c33"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.55"/>
  <!-- 边框：标明这是 1920x1080 安全区 -->
  <rect x="24" y="24" width="1872" height="1032" fill="none" stroke="#2a3a63" stroke-width="3" stroke-dasharray="18 14"/>
  <!-- 顶部：镜号 + 时长 -->
  <text x="70" y="140" fill="#ffb648" font-size="86" font-weight="bold" letter-spacing="6">S17</text>
  <text x="330" y="140" fill="#7c8db5" font-size="40">4s</text>
  <text x="1850" y="140" fill="#4a5c85" font-size="34" text-anchor="end">1920 x 1080</text>
  <!-- 中部：标题 -->
  <text x="70" y="300" fill="#e5e7eb" font-size="64" font-weight="bold">开启 10 倍速</text>
  <!-- 中部：场景 -->
  <text x="70" y="392" fill="#8fa3cc" font-size="40">场景：对局主界面 · 顶栏周期数字快跑</text>
  <text x="70" y="456" fill="#8fa3cc" font-size="40">运镜：固定机位 scale 1.00→1.04</text>
  <!-- 中部：画面描述（自动换行） -->
  <text x="70" y="560" fill="#c7d3ea" font-size="36">按游戏内「+」加速键，顶栏周期数字快跑（真实功能，非后期变速</text>
  <text x="70" y="616" fill="#c7d3ea" font-size="36">）</text>  <!-- 底部：替换提示 -->
  <rect x="0" y="940" width="1920" height="120" fill="#000000" opacity="0.42"/>
  <text x="70" y="1002" fill="#ffb648" font-size="38">占位素材 PLACEHOLDER · 请替换为实机录屏</text>
  <text x="1850" y="1002" fill="#7c8db5" font-size="34" text-anchor="end">命名：S17_speedup.mp4</text>
</svg>
